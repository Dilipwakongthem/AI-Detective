<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Files: AI Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Authentication Check - ENABLED -->
    <script>
        // Check for authentication - redirect to login if not authenticated
        (function() {
            // Add small delay to ensure localStorage is fully written
            setTimeout(function() {
                const guestId = localStorage.getItem('guestUserId');
                const userType = localStorage.getItem('userType');
                const userEmail = localStorage.getItem('currentUserEmail');
                const userId = localStorage.getItem('currentUserId');

                console.log('Authentication check:', { guestId, userType, userEmail, userId });

                // Check if user has any authentication session
                const isGuest = guestId && userType === 'guest';
                const isEmail = (userEmail || userId) && userType === 'email';
                const isFacebook = (userEmail || userId) && userType === 'facebook';
                const isAuthenticated = isGuest || isEmail || isFacebook;

                console.log('Auth status:', { isGuest, isEmail, isFacebook, isAuthenticated });

                if (!isAuthenticated) {
                    // No session found - redirect to login page
                    console.log('No authentication found. Redirecting to login...');
                    window.location.href = 'index.html';
                } else {
                    console.log('Authenticated user found. User type:', userType);
                }
            }, 100); // Small delay to ensure localStorage is ready
        })();
    </script>

    <div id="root"></div>
    <script type="module" src="../src/index.jsx"></script>
</body>
</html>
