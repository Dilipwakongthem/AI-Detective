<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Files: AI Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Authentication Check - ENABLED -->
    <script>
        // Check for authentication - redirect to login if not authenticated
        (function() {
            console.log('[AUTH CHECK] Starting authentication check...');

            // Immediate check first
            const quickCheck = localStorage.getItem('userType');
            console.log('[AUTH CHECK] Quick check - userType:', quickCheck);

            if (!quickCheck) {
                console.log('[AUTH CHECK] No userType found immediately, redirecting to login');
                window.location.href = 'index.html';
                return;
            }

            // More thorough check after delay
            setTimeout(function() {
                const guestId = localStorage.getItem('guestUserId');
                const userType = localStorage.getItem('userType');
                const userEmail = localStorage.getItem('currentUserEmail');
                const userId = localStorage.getItem('currentUserId');

                console.log('[AUTH CHECK] Detailed check:', {
                    guestId,
                    userType,
                    userEmail,
                    userId,
                    timestamp: new Date().toISOString()
                });

                // Check if user has any authentication session
                const isGuest = guestId && userType === 'guest';
                const isEmail = (userEmail || userId) && userType === 'email';
                const isFacebook = (userEmail || userId) && userType === 'facebook';
                const isAuthenticated = isGuest || isEmail || isFacebook;

                console.log('[AUTH CHECK] Auth status:', {
                    isGuest,
                    isEmail,
                    isFacebook,
                    isAuthenticated
                });

                if (!isAuthenticated) {
                    console.log('[AUTH CHECK] Authentication FAILED - Redirecting to login');
                    window.location.href = 'index.html';
                } else {
                    console.log('[AUTH CHECK] Authentication SUCCESS - Loading game for user type:', userType);
                }
            }, 50); // Reduced delay since we already did quick check
        })();
    </script>

    <div id="root"></div>
    <script type="module" src="../src/index.jsx"></script>
</body>
</html>
