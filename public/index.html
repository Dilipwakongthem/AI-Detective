<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Detective: Crime Scene - Login</title>
  <link rel="stylesheet" href="styles/login.css">
</head>
<body class="login-page">

  <div class="login-container">
    <!-- Game Title -->
    <div class="game-logo">
      <h1 class="game-title">AI DETECTIVE</h1>
      <h2 class="game-subtitle">CRIME SCENE</h2>
      <p class="game-tagline">Solve Crimes with AI-Powered Interrogation</p>
    </div>

    <!-- Login Options -->
    <div class="login-options">

      <!-- Guest Login - FUNCTIONAL -->
      <button class="login-btn btn-guest" id="guestLoginBtn">
        <div class="btn-icon">👤</div>
        <div class="btn-content">
          <div class="btn-label">PLAY AS GUEST</div>
          <div class="btn-sublabel">Start playing immediately</div>
          <div class="btn-note">(Progress saved on this device)</div>
        </div>
      </button>

      <!-- Divider -->
      <div class="login-divider">
        <span>OR SIGN IN</span>
      </div>

      <!-- Email Login - FUNCTIONAL -->
      <button class="login-btn btn-email" id="emailLoginBtn">
        <div class="btn-icon">📧</div>
        <div class="btn-content">
          <div class="btn-label">EMAIL LOGIN</div>
          <div class="btn-sublabel">Sign in with your account</div>
        </div>
      </button>

      <!-- Facebook Login - FUNCTIONAL -->
      <button class="login-btn btn-facebook" id="facebookLoginBtn">
        <div class="btn-icon">📘</div>
        <div class="btn-content">
          <div class="btn-label">CONTINUE WITH FACEBOOK</div>
          <div class="btn-sublabel">Sign in with Facebook account</div>
        </div>
      </button>

      <!-- Google Login - DUMMY -->
      <button class="login-btn btn-google btn-disabled" id="googleLoginBtn">
        <div class="btn-icon">🔵</div>
        <div class="btn-content">
          <div class="btn-label">CONTINUE WITH GOOGLE</div>
          <div class="btn-coming-soon">Coming Soon</div>
        </div>
        <div class="btn-lock">🔒</div>
      </button>

    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p class="signup-prompt">
        Don't have an account?
        <a href="#" id="showSignupBtn" class="signup-link">Sign Up</a>
      </p>
      <p class="version-info">Version 1.0 | © 2025</p>
    </div>
  </div>

  <!-- Email Login Modal -->
  <div id="emailLoginModal" class="auth-modal" style="display: none;">
    <div class="modal-overlay" onclick="closeEmailLoginModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button class="back-btn" onclick="closeEmailLoginModal()">← BACK</button>
        <h2>LOGIN</h2>
      </div>

      <div class="modal-body">
        <p class="welcome-text">👋 Welcome back, Detective!</p>

        <form id="loginForm" onsubmit="handleEmailLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="detective@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="loginPassword"
                class="form-input"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword')">
                👁️
              </button>
            </div>
          </div>

          <div class="form-actions">
            <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="submit-btn">
            LOGIN
          </button>
        </form>

        <p class="switch-auth">
          Don't have an account?
          <a href="#" onclick="switchToSignup(event)">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Email Signup Modal -->
  <div id="emailSignupModal" class="auth-modal" style="display: none;">
    <div class="modal-overlay" onclick="closeEmailSignupModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button class="back-btn" onclick="closeEmailSignupModal()">← BACK</button>
        <h2>CREATE ACCOUNT</h2>
      </div>

      <div class="modal-body">
        <p class="welcome-text">🎯 Join the Investigation!</p>

        <form id="signupForm" onsubmit="handleEmailSignup(event)">
          <div class="form-group">
            <label>Detective Name (Optional)</label>
            <input
              type="text"
              id="signupName"
              class="form-input"
              placeholder="Your detective name"
              maxlength="30"
            />
          </div>

          <div class="form-group">
            <label>Email Address *</label>
            <input
              type="email"
              id="signupEmail"
              class="form-input"
              placeholder="detective@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label>Password * (min 6 characters)</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="signupPassword"
                class="form-input"
                placeholder="Create a password"
                minlength="6"
                required
              />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signupPassword')">
                👁️
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password *</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="signupPasswordConfirm"
                class="form-input"
                placeholder="Confirm your password"
                minlength="6"
                required
              />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signupPasswordConfirm')">
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            CREATE ACCOUNT
          </button>
        </form>

        <p class="switch-auth">
          Already have an account?
          <a href="#" onclick="switchToLogin(event)">Login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>

  <!-- Firebase Authentication Modules -->
  <script type="module" src="js/firebaseAuth.js"></script>
  <script type="module" src="js/loginHandlers.js"></script>

  <!-- Facebook SDK -->
  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId      : AUTH_CONFIG.facebook.appId,
        cookie     : true,
        xfbml      : true,
        version    : AUTH_CONFIG.facebook.version
      });

      console.log('Facebook SDK initialized');

      // Check login status on load
      FB.getLoginStatus(function(response) {
        console.log('Facebook login status:', response.status);
      });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <!-- Keep original login.js for fallback/guest mode -->
  <script src="js/login.js"></script>
</body>
</html>
