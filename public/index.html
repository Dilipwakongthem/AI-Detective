<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Files: AI Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Authentication Check - DISABLED to allow direct game access -->
    <!-- Login system is optional - accessible via login.html -->
    <script>
        // Optional: Auto-create guest session if none exists
        (function() {
            const guestId = localStorage.getItem('guestUserId');
            const userType = localStorage.getItem('userType');

            // If no session exists, create a default guest session
            if (!guestId && !userType) {
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 9);
                const newGuestId = `guest_${timestamp}_${random}`;

                localStorage.setItem('guestUserId', newGuestId);
                localStorage.setItem('isGuestUser', 'true');
                localStorage.setItem('userType', 'guest');

                console.log('Auto-created guest session:', newGuestId);
            } else {
                console.log('Existing session found. User type:', userType);
            }
        })();
    </script>

    <div id="root"></div>
    <script type="module" src="../src/index.jsx"></script>
</body>
</html>
