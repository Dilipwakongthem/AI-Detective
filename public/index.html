<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Files: AI Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Authentication Check -->
    <script>
        // Check if user is authenticated before loading the game
        (function() {
            const guestId = localStorage.getItem('guestUserId');
            const isGuest = localStorage.getItem('isGuestUser') === 'true';
            const userEmail = localStorage.getItem('currentUserEmail');
            const userType = localStorage.getItem('userType');

            // Check if user is logged in (either as guest or email user)
            const isAuthenticated = (guestId && isGuest && userType === 'guest') ||
                                   (userEmail && userType === 'email');

            if (!isAuthenticated) {
                // Redirect to login page if not authenticated
                console.log('No active session found. Redirecting to login...');
                window.location.href = 'login.html';
            } else {
                console.log('Active session found. User type:', userType);
            }
        })();
    </script>

    <div id="root"></div>
    <script type="module" src="../src/index.jsx"></script>
</body>
</html>
